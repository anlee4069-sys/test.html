<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>2026 研發部尾牙抽獎</title>

<style>
body{
  margin:0;
  font-family:"Microsoft JhengHei",sans-serif;
  background:#b30000;
  color:gold;
  text-align:center;
}
h1{font-size:56px;margin:30px 0}
#desc{font-size:22px;color:#fff2b3;line-height:1.8}

#controls input,button{
  font-size:22px;
  padding:10px 16px;
  margin:6px;
}

button{background:gold;border:none;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,160px);
  gap:20px;
  justify-content:center;
  padding:30px;
}

.player{
  transition:.4s;
}
.player.won{
  opacity:.35;
  filter:grayscale(100%);
}

.avatar{
  width:140px;height:140px;
  border-radius:50%;
  border:5px solid gold;
  object-fit:cover;
}
.name{
  font-size:20px;color:white;margin-top:6px;
}

/* 倒數與抽獎畫面 */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}

#countNum{font-size:160px}
#slot img,#winner img{
  width:300px;height:300px;
  border-radius:50%;
  border:8px solid gold;
}
#prizeText{font-size:42px;margin-bottom:20px}
#winnerName{font-size:42px;color:white}
</style>
</head>

<body>

<h1>🎉 2026 研發部尾牙宴｜大獎帶回家！ 🎉</h1>

<div id="desc">
獎金依序抽出（系統自動）：<br>
1200×4 → 2000×4 → 3000×3 → 5000 → 7000 → 10000<br>
🎯 每人僅一次機會，抽中即標示
</div>

<div id="controls">
  <input id="photo" type="file" accept="image/*">
  <input id="nameInput" placeholder="輸入姓名">
  <button onclick="addPlayer()">加入</button>
  <br>
  <button id="drawBtn" onclick="startDraw()">開始抽獎</button>
</div>

<div id="grid"></div>

<div id="countdown" class="overlay">
  <div id="prizeText"></div>
  <div id="countNum"></div>
</div>

<div id="slot" class="overlay">
  <div id="prizeText"></div>
  <img id="slotImg">
</div>

<div id="winner" class="overlay" onclick="this.style.display='none'">
  <div id="prizeText"></div>
  <img id="winnerImg">
  <div id="winnerName"></div>
</div>

<script>
let players=[];
let activePlayers=[];
let locked=false;

let prizePool=[
  ...Array(4).fill(1200),
  ...Array(4).fill(2000),
  ...Array(3).fill(3000),
  5000,7000,10000
];

function addPlayer(){
  if(locked) return alert("抽獎已開始，名單已鎖定");
  const file=photo.files[0];
  const name=nameInput.value.trim();
  if(!file||!name) return;

  const r=new FileReader();
  r.onload=()=>{
    const p={name,img:r.result,won:false};
    players.push(p);
    activePlayers.push(p);
    render();
    nameInput.value="";photo.value="";
  };
  r.readAsDataURL(file);
}

function render(){
  grid.innerHTML="";
  players.forEach(p=>{
    grid.innerHTML+=`
      <div class="player ${p.won?"won":""}">
        <img class="avatar" src="${p.img}">
        <div class="name">${p.name}</div>
      </div>`;
  });
}

function startDraw(){
  if(!activePlayers.length||!prizePool.length) return;
  locked=true;
  drawBtn.disabled=true;
  countdown(3);
}

function countdown(n){
  const prize=prizePool[0];
  countdown.style.display="flex";
  prizeText.innerText=`💰 ${prize} 元 得獎的是…`;
  countNum.innerText=n;
  if(n>1){
    setTimeout(()=>countdown(n-1),1000);
  }else{
    setTimeout(()=>{
      countdown.style.display="none";
      slot();
    },1000);
  }
}

function slot(){
  const prize=prizePool[0];
  slot.style.display="flex";
  prizeText.innerText=`💰 ${prize} 元 得獎的是…`;

  const t=setInterval(()=>{
    slotImg.src=activePlayers[Math.random()*activePlayers.length|0].img;
  },100);

  setTimeout(()=>{
    clearInterval(t);
    slot.style.display="none";
    drawWinner();
  },2000);
}

function drawWinner(){
  const prize=prizePool.shift();
  const i=Math.random()*activePlayers.length|0;
  const w=activePlayers.splice(i,1)[0];
  w.won=true;

  winnerImg.src=w.img;
  winnerName.innerText=w.name;
  prizeText.innerText=`🎉 恭喜獲得 ${prize} 元`;
  winner.style.display="flex";

  render();
  drawBtn.disabled=false;
}
</script>

</body>
</html>
