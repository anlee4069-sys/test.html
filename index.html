<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>2026 研發部尾牙抽獎</title>

<style>
body {
  margin: 0;
  font-family: "Microsoft JhengHei", sans-serif;
  background: #b30000;
  color: gold;
  text-align: center;
  overflow-x: hidden;
}

/* 金色亮粉 */
.sparkle {
  position: fixed;
  width: 4px;
  height: 4px;
  background: gold;
  opacity: 0.8;
  animation: float 6s linear infinite;
}
@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); opacity: 0; }
}

h1 {
  font-size: 56px;
  margin: 30px 0 20px;
}

#desc {
  font-size: 22px;
  line-height: 1.8;
  color: #fff2b3;
}

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 160px);
  gap: 20px;
  justify-content: center;
  padding: 30px;
}

.avatar {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 5px solid gold;
  object-fit: cover;
}

.name {
  font-size: 20px;
  margin-top: 8px;
  color: #fff;
}

/* 按鈕 */
button {
  font-size: 26px;
  padding: 14px 28px;
  margin: 20px;
  background: gold;
  border: none;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* 倒數 */
#countdown {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 160px;
  z-index: 10;
}

/* 跑馬燈 */
#slot, #winner {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 20;
}

#slot img, #winner img {
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 8px solid gold;
}

#prizeText {
  font-size: 40px;
  margin-bottom: 20px;
}

#summary {
  display: none;
  padding: 40px;
  font-size: 24px;
}

table {
  margin: auto;
  border-collapse: collapse;
}

td, th {
  border: 2px solid gold;
  padding: 12px 24px;
}
</style>
</head>

<body>

<h1>🎉 2026 研發部尾牙宴｜大獎帶回家！ 🎉</h1>

<div id="desc">
獎金依序抽出（系統自動）：<br>
1200×4 → 2000×4 → 3000×3 → 5000 → 7000 → 10000<br><br>
🎯 每人僅一次機會，抽中即移除
</div>

<input type="file" accept="image/*" onchange="addPlayer(event)">
<input id="nameInput" placeholder="輸入名字" style="font-size:22px;">
<br>
<button id="drawBtn" onclick="startDraw()">開始抽獎</button>

<div id="grid"></div>

<div id="countdown"></div>

<div id="slot">
  <div id="prizeText"></div>
  <img id="slotImg">
</div>

<div id="winner" onclick="this.style.display='none'">
  <div id="prizeText"></div>
  <img id="winnerImg">
  <h2 id="winnerName" style="font-size:40px;color:white;"></h2>
</div>

<div id="summary">
  <h1>🎊 中獎名單 🎊</h1>
  <table>
    <thead><tr><th>姓名</th><th>金額</th></tr></thead>
    <tbody id="resultTable"></tbody>
  </table>
</div>

<script>
let players = [];
let results = [];

/* 獎金池（不可重複） */
let prizePool = [
  ...Array(4).fill(1200),
  ...Array(4).fill(2000),
  ...Array(3).fill(3000),
  5000, 7000, 10000
];

function addPlayer(e) {
  const name = nameInput.value.trim();
  if (!name) return alert("請輸入名字");
  const reader = new FileReader();
  reader.onload = () => {
    players.push({ name, img: reader.result });
    render();
    nameInput.value = "";
  };
  reader.readAsDataURL(e.target.files[0]);
}

function render() {
  grid.innerHTML = "";
  players.forEach(p => {
    grid.innerHTML += `
      <div>
        <img class="avatar" src="${p.img}">
        <div class="name">${p.name}</div>
      </div>`;
  });
}

function startDraw() {
  if (!players.length || !prizePool.length) return;
  drawBtn.disabled = true;
  countdown(3);
}

function countdown(n) {
  countdownEl.style.display = "flex";
  countdownEl.innerText = n;
  if (n > 1) {
    setTimeout(() => countdown(n - 1), 1000);
  } else {
    setTimeout(() => {
      countdownEl.style.display = "none";
      slot();
    }, 1000);
  }
}

function slot() {
  const prize = prizePool[0];
  prizeText.innerText = `💰 本次獎金：${prize} 元`;
  slotEl.style.display = "flex";

  const timer = setInterval(() => {
    slotImg.src = players[Math.random() * players.length | 0].img;
  }, 100);

  setTimeout(() => {
    clearInterval(timer);
    slotEl.style.display = "none";
    draw(prize);
  }, 2000);
}

function draw(prize) {
  prizePool.shift();
  const i = Math.random() * players.length | 0;
  const w = players.splice(i, 1)[0];
  results.push({ name: w.name, prize });

  winnerImg.src = w.img;
  winnerName.innerText = w.name;
  prizeText.innerText = `🎉 中獎金額：${prize} 元`;
  winner.style.display = "flex";

  render();
  drawBtn.disabled = false;

  if (!prizePool.length) showSummary();
}

function showSummary() {
  summary.style.display = "block";
  results.forEach(r => {
    resultTable.innerHTML += `<tr><td>${r.name}</td><td>${r.prize}</td></tr>`;
  });
}

/* 金色亮粉 */
setInterval(() => {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 6000);
}, 120);
</script>

</body>
</html>
